name: CI Rust

# CI Rust + frontend (branche Tauri) : formatage, lints, build, tests.
# Cinq jobs indépendants (parallélisme maximal sur les runners
# horror_cli-worker du r630), chacun borné à 5 min (règle user 2026-10-24).
# `--locked` partout côté Rust : le build CI utilise exactement Cargo.lock.
# Noms des 4 checks Rust inchangés (exigés par la file Mergify).

on:
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-rust-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: fmt
    runs-on: [self-hosted, horror_cli-worker]
    timeout-minutes: 5
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - name: Checkout (superficiel)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Toolchain Rust (stable + fmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Formatage
        run: cargo fmt --check

  clippy:
    name: clippy
    runs-on: [self-hosted, horror_cli-worker]
    timeout-minutes: 5
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - name: Checkout (superficiel)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Toolchain Rust (stable + fmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Syslibs Tauri (webkit)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Lints (zéro warning)
        run: cargo clippy --all-targets --locked -- -D warnings

  build:
    name: build
    runs-on: [self-hosted, horror_cli-worker]
    timeout-minutes: 5
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - name: Checkout (superficiel)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Toolchain Rust (stable + fmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Syslibs Tauri (webkit)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Compilation
        run: cargo build --locked

  test:
    name: test
    runs-on: [self-hosted, horror_cli-worker]
    timeout-minutes: 5
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - name: Checkout (superficiel)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Toolchain Rust (stable + fmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Syslibs Tauri (webkit)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Tests
        run: cargo test --locked

  frontend:
    name: frontend
    runs-on: [self-hosted, horror_cli-worker]
    timeout-minutes: 5
    steps:
      - name: Checkout (superficiel)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Node (LTS + cache npm)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Dépendances (verrouillées)
        run: npm ci
      - name: Types (svelte-check)
        run: npm run check
      - name: Tests (vitest)
        run: npm test
      - name: Build (vite)
        run: npm run build
