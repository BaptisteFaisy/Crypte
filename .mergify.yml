# File de merge Mergify — socle CI self-hosted (R630).
#
# CI réelle (`.github/workflows/ci.yml`, PR #113/#117/#120) : la file exige
# ses 4 checks + le socle. `hermes-lite/verdict` rejoindra la file à la
# sortie du dry-run (HERMES_LITE_DRY_RUN=1 : le gate ne publie aucun verdict
# sur les PR en retard, l'exiger bloquerait tout).
# Structure copiée du .mergify.yml de BaptisteFaisy/duello (décision
# user 2026-10-10) : inline labels urgent / priority-low identiques.
queue_rules:
  - name: default
    queue_conditions:
      # Budget CI 5 min (règle user 2026-10-24) : le garde-fou du socle.
      - check-success = ci-budget
      # CI Rust : fmt/clippy/build/test verts exigés (sinon la file merge
      # avec une CI rouge, constaté sur #113/#117).
      - check-success = fmt
      - check-success = clippy
      - check-success = build
      - check-success = test
      - check-success = stale-base-guard
      - -conflict
      - -draft
      - base = main
    batch_size:
      min: 1
      max: 3
    batch_max_wait_time: "10 seconds"
    max_checks_retries: 1
    checks_timeout: 5 min
    # Squash, pas rebase (décision user 2026-11-08) : une PR = un commit
    # sur main (historique linéaire), et une PR qui a fusionné main en
    # elle (résolution de conflits, Auto-fix) reste fusionnable. En rebase,
    # GitHub rejoue chaque commit tel quel et refuse dès qu'un commit
    # d'avant la fusion ne s'applique plus (PR #73 sortie de la file
    # « GitHub cannot rebase the pull request »).
    merge_method: squash
    # Mise à jour par merge de main : jamais de réécriture (force-push)
    # des branches de PR, et pas d'échec sur les PR déjà fusionnées.
    update_method: merge
    # Commit squashé = « titre de la PR (#n) » + description de la PR
    # (pas la liste des commits de merge).
    commit_message_format:
      title: pr-title
      body: pr-body

priority_rules:
  - name: urgent
    conditions:
      - label = urgent
    priority: high
  - name: priority-low
    conditions:
      - label = priority-low
    priority: low

merge_queue:
  # N workers self-hosted (R630, labels horror_cli-worker) ; la speculation
  # Mergify reste bornee a 4, ajustable.
  max_parallel_checks: 4

# File automatique : toute PR prête entre seule dans la file, sans geste
# manuel (demande user 2026-11-07 : « je veux que ça soit automatique »).
# Même contrat que `queue_conditions` ci-dessus + le garde de base ; le
# label `hold` est la sortie de secours pour garder une PR hors file.
# Rappel : l'auto-merge natif GitHub doit rester activé sur le dépôt
# (allow_auto_merge=true) pour que la file s'enchaîne sans intervention.
pull_request_rules:
  - name: file automatique des PR prêtes
    conditions:
      - check-success = ci-budget
      - check-success = stale-base-guard
      - -closed
      - -draft
      - -conflict
      - -label = hold
      - base = main
    actions:
      queue:

# Auto-queue natif (produit Merge Queue) : évite de dépendre du produit
# « Workflow Automation » (pull_request_rules), constaté désactivé le 24/10.
merge_protections_settings:
  auto_merge_conditions: true
