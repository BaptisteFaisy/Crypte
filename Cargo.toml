[package]
name = "kiro-horror-tui"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "TUI horreur : chat LLM dans une crypte, mascotte fantome Kiro, effets sang/brouillard"

[dependencies]
ratatui = { version = "0.29", features = ["crossterm"] }
crossterm = { version = "0.28", features = ["event-stream"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "http2", "charset", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiktoken-rs = "0.12"
rand = "0.9"
toml = "1"
anyhow = "1"
ratatui-image = { version = "8", default-features = false, features = ["crossterm"] }
image = { version = "0.25", default-features = false, features = ["png"] }
