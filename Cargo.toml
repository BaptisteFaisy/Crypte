[package]
name = "kiro-horror-tui"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Horror TUI: LLM chat in a crypt, Kiro the ghost mascot, blood/fog effects"

# IMPL-1 (perf/mem-cargo) : features minimales, chaque choix verifie par grep + `cargo check`.
[dependencies]
# ratatui : default-features=false retire "underline-color" (inutilise, grep negatif) ;
# "crossterm" seul garde (backend DefaultTerminal + TestBackend des tests).
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
# crossterm : feature "event-stream" retiree (EventStream inutilise ;
# boucle evenements = poll + read bloquants dans src/app.rs).
crossterm = "0.28"
# tokio : "full" -> macros + rt + rt-multi-thread + sync + time + process + io-util.
# Usages reels : #[tokio::main] + #[tokio::test] + join! (macros), spawn + JoinSet (rt),
# mpsc (sync), timeout (time, exige aussi par reqwest/hyper),
# Command + timeout (process, executions d'outils dans src/tools/exec.rs),
# duplex + BufReader + read_line + write_all + split (io-util, client MCP dans src/kiro/mcp_*).
# Zero usage de fs/net/signal (grep negatif).
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "time", "process", "io-util"] }
# reqwest : "stream" retire (aucun bytes_stream, .bytes() one-shot suffit),
# "charset" retire (reponses JSON/HTML UTF-8 : OpenAI/Meta/Tavily/Brave/DDG/Wikipedia,
# .text() suppose UTF-8 desormais), "http2" retire (HTTP/1.1 suffit, trafic sequentiel).
# Gardes : json, rustls-tls, system-proxy (comportement : proxies d'entreprise via env),
# gzip (decompression auto /web, ajoute par main).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "system-proxy", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# tiktoken-rs : garde fonctionnel (estimation locale, CONTEXT_LIMIT) ; le rendre optionnel
# demanderait du cfg dans src/tokens.rs -> chantier separe, hors Cargo.toml seul.
tiktoken-rs = "0.12"
# rand : garde tel quel (random()/random_range() exigent thread_rng des features par defaut).
rand = "0.9"
# toml : default-features=false retire "display" (aucun to_string, seul from_str utilise).
toml = { version = "1", default-features = false, features = ["std", "parse", "serde", "display"] }
anyhow = "1"
# Deja minimales, inchangees : ratatui-image/crossterm-only, image/png-only.
ratatui-image = { version = "8", default-features = false, features = ["crossterm"] }
image = { version = "0.25", default-features = false, features = ["png"] }
# chacha20poly1305 : coffre chiffre des cles API (/settings, voir src/settings/store.rs).
# AEAD (chiffrement + authentification) : mauvais fichier = erreur, pas de dechiffrement partiel.
chacha20poly1305 = "0.10"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }
# libc : sonde terminal maison (src/gfx.rs : poll + ioctl TIOCGWINSZ sur
# /dev/tty). Remplace Picker::from_query_stdio (ratatui-image 8.1.1) dont le
# thread de requete fuit et vole ~1 frappe sur 2 a crossterm sur stdin.
libc = "0.2"

# IMPL-1 (perf/mem-cargo) : profil release durci (absent avant -> defauts cargo :
# opt-level=3, debug=false, strip=none, lto=false, codegen-units=256, panic=unwind).
[profile.release]
opt-level = 3 # perf boucle rendu 10 Hz (defaut cargo, explicite)
debug = false # pas de symboles DWARF (defaut cargo, explicite)
strip = "symbols" # retire la table des symboles (-10/20 % taille), garde des backtraces lisibles
lto = true # fat LTO : dedup codegen inter-crates maximale (link release plus lent)
codegen-units = 1 # une seule unite = LTO maximal (avec lto=true)
# panic="abort" REFUSE ici : la restauration du terminal (raw mode, alternate screen,
# capture souris) repose sur Drop pendant l'unwind ; abort laisserait le terminal casse.
panic = "unwind"
overflow-checks = false # defaut release, explicite
