# "Crypt" theme for kiro-horror-tui (Ghostty ≥ 1.2).
# Loaded by the `ghostty/crypte` launcher, or by hand:
#   ghostty --config-file=/path/Horror/ghostty/crypte.conf
# Palette = src/theme.rs (Dribbble shot "Halloween icons and illustrations").

background = #0c0908
foreground = #ebddc3
cursor-color = #ffc46b
cursor-text = #0c0908
selection-background = #6e101a
selection-foreground = #ebddc3

palette = 0=#120d0b
palette = 1=#d7263d
palette = 2=#7cf29a
palette = 3=#ffc46b
palette = 4=#9b8cff
palette = 5=#f2701e
palette = 6=#baa685
palette = 7=#ebddc3
palette = 8=#4c4437
palette = 9=#ff5a6e
palette = 10=#a8ffbf
palette = 11=#ffd99a
palette = 12=#c2b8ff
palette = 13=#ff9a52
palette = 14=#d6c7a6
palette = 15=#fff6e6

# The crypt background bleeds to the window edges.
window-padding-x = 12
window-padding-y = 8
window-padding-balance = true
window-padding-color = extend
background-opacity = 0.97

# 120x36: roomy default so the side panels breathe.
window-width = 120
window-height = 36
title = Crypt
# Static shader (vignette only, no flame, no grain): no animation.
custom-shader-animation = false
